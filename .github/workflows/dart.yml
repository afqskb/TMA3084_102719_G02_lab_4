name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          
      - run: flutter pub get
      
      # 1. Check code formatting against Dart standards
      - run: dart format --output=none --set-exit-if-changed .
      
      # 2. Run static analysis to catch lints and potential bugs early
      - run: flutter analyze
      
      # 3. Run tests with expanded output for better debugging in CI logs
      - run: flutter test --reporter expanded
